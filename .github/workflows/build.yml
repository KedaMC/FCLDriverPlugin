name: Build APK

# Berjalan otomatis setiap push ke branch driver/* (tidak menyentuh main),
# dan bisa juga dipicu manual dari tab Actions bila file ini sudah ada di default branch.
on:
  push:
    branches:
      - "driver/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK mentah: $UNSIGNED"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Memakai keystore dari GitHub Secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KS="$RUNNER_TEMP/release.jks"; KS_PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; K_PASS="$KEY_PASSWORD"
          else
            echo "Secrets keystore tidak ada, membuat keystore sementara (kunci berubah di setiap build)"
            KS="$RUNNER_TEMP/temp.jks"; KS_PASS="android"; ALIAS="temp"; K_PASS="android"
            keytool -genkeypair -v -keystore "$KS" -storepass "$KS_PASS" -keypass "$K_PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PanVk G52"
          fi

          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          mkdir -p out
          "$APKSIGNER" sign --ks "$KS" --ks-pass "pass:$KS_PASS" --ks-key-alias "$ALIAS" \
            --key-pass "pass:$K_PASS" --out out/PanVk-LukeValen.apk "$UNSIGNED"
          "$APKSIGNER" verify --print-certs out/PanVk-LukeValen.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PanVk-LukeValen
          path: out/PanVk-LukeValen.apk
          if-no-files-found: error
