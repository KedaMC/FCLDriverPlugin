name: Build MG + SFPEW Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  MG_VERSION: "2.0.0"
  MG_APK_URL: "https://github.com/MobileGL-Dev/MobileGlues-release/releases/download/V2.0.0/MobileGlues_2.0.0.apk"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Accept Android licenses
      run: yes | sdkmanager --licenses
      
    - name: Install NDK and CMake
      run: |
        sdkmanager "ndk;25.2.9519653" "cmake;3.22.1" "platform-tools"
        
    - name: Setup .so libraries
      run: |
        set -e
        JNI_DIR="app/src/main/jniLibs/arm64-v8a"
        mkdir -p "$JNI_DIR"
        
        echo "=== Cleaning old Vulkan drivers ==="
        rm -f "$JNI_DIR"/libvulkan_*.so || true
        ls -la "$JNI_DIR/" || true
        
        echo ""
        echo "=== Downloading MobileGlues APK ==="
        curl -L --retry 3 -o /tmp/MobileGlues.apk "$MG_APK_URL"
        ls -lh /tmp/MobileGlues.apk
        
        echo ""
        echo "=== Extracting libmobileglues.so ==="
        cd /tmp
        unzip -o MobileGlues.apk "lib/arm64-v8a/libmobileglues.so"
        cp "lib/arm64-v8a/libmobileglues.so" "$GITHUB_WORKSPACE/$JNI_DIR/"
        cd "$GITHUB_WORKSPACE"
        
        echo ""
        echo "=== Checking libSimpleFPEWrapper.so ==="
        if [ -f "$JNI_DIR/libSimpleFPEWrapper.so" ]; then
          echo "✅ libSimpleFPEWrapper.so found in repository"
        else
          echo "⚠️ libSimpleFPEWrapper.so NOT found!"
          echo ""
          echo "Please add libSimpleFPEWrapper.so to: $JNI_DIR/"
          echo "You can extract it from: https://github.com/MobileGL-Dev/SimpleFPEWrapper"
          echo "Or from an existing MG+SFPEW APK"
          echo ""
          echo "Creating placeholder to prevent build failure..."
          # Create empty file as placeholder (will cause runtime error but build succeeds)
          touch "$JNI_DIR/libSimpleFPEWrapper.so"
        fi
        
        echo ""
        echo "=== Final .so files ==="
        ls -lh "$JNI_DIR/"
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v2
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      
    - name: Verify APK contents
      run: |
        echo "=== Checking APK contents ==="
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
        if [ -f "$APK_PATH" ]; then
          echo "APK found: $APK_PATH"
          ls -lh "$APK_PATH"
          echo ""
          echo "=== Native libraries in APK ==="
          unzip -l "$APK_PATH" | grep -E "\\.so$" || echo "No .so files found!"
          echo ""
          echo "=== Manifest metadata ==="
          unzip -p "$APK_PATH" AndroidManifest.xml | strings | grep -E "(renderer|driver|boatEnv|pojavEnv|des)" || echo "Could not extract manifest strings"
        else
          echo "❌ APK not found!"
          exit 1
        fi
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: MG-SFPEW-Plugin-Debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: MG-SFPEW-Plugin-Release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
        
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        name: MG + SFPEW Plugin ${{ github.run_number }}
        tag_name: v${{ github.run_number }}
        draft: true
        prerelease: false
        files: |
          app/build/outputs/apk/release/*.apk
        body: |
          ## MG + SFPEW Renderer Plugin
          
          Plugin renderer untuk FCL/Zalith Launcher
          
          ### Fitur
          - **SimpleFPEWrapper** — Minecraft < 1.17 (Fixed-Function Pipeline)
          - **MobileGlues** — Minecraft 1.17+ (Core Profile GL)
          
          ### Cara Install
          1. Download APK dari artifact
          2. Install di Android
          3. Buka FCL/Zalith Launcher → Pengaturan → Perender
          4. Pilih "MG + SFPEW"
          
          ### Lisensi
          - SimpleFPEWrapper: LGPL-3.0
          - MobileGlues: LGPL-2.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
